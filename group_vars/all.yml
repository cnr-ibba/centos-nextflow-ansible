---
# micromamba instead of Miniforge/Miniconda: space in $HOME is limited.
# The binary goes to $HOME/bin (the dotfiles export MAMBA_EXE=$HOME/bin/micromamba and
# MAMBA_ROOT_PREFIX=$HOME/.conda). Environments must be declared with absolute paths
# (e.g. "{{ ansible_env.HOME }}/.conda/envs/<name>") to match the role's `creates:` check.
micromamba_version: 2.9.0-0   # mamba-org/micromamba-releases tag
micromamba_url: "https://github.com/mamba-org/micromamba-releases/releases/download/{{ micromamba_version }}/micromamba-linux-64"

# galaxyproject.miniconda settings: it must find the binary installed by the micromamba role
miniconda_distribution: micromamba
miniconda_prefix: "{{ ansible_env.HOME }}"
miniconda_installer_version: "{{ micromamba_version }}"
miniconda_version: "{{ micromamba_version }}"
# the binary comes from the micromamba role, never from the galaxy role's installer
miniconda_install: false
# self-update would report "changed" on every run
miniconda_update: false

# bunop/dotfiles: `bin/install bash` links ~/.bashrc, ~/.bash_profile (NXF_* variables, SDKMAN and
# micromamba init), ~/.bash_aliases... The clone is not refreshed unless -e dotfiles_update=true
dotfiles_repo: https://github.com/bunop/dotfiles.git
dotfiles_version: cineca
dotfiles_module: bash
dotfiles_dest: "{{ ansible_env.HOME }}/dotfiles"
dotfiles_update: false

# SDKMAN + Java. Nextflow 26.x needs Java 17-26; the identifier is the one `sdk list java` prints.
sdkman_java_version: 21.0.13.0+9-tem

# Nextflow launcher (plain script from the GitHub release; it fetches its runtime into ~/.nextflow on first run)
nextflow_version: 26.10.5
nextflow_url: "https://github.com/nextflow-io/nextflow/releases/download/v{{ nextflow_version }}/nextflow"
nextflow_sha256: 7b6005aa9da0611d404c218b515f57c7b8e91a78af9e2c2adb21c4074eb2d175

# jq (static binary into ~/bin), required by squeue.sh and sacct.sh
jq_version: 1.8.2
jq_url: "https://github.com/jqlang/jq/releases/download/jq-{{ jq_version }}/jq-linux-amd64"
jq_sha256: b1c22172dd303f3be49e935aa56aa48a8b7a46e0bc838b4997d3bb451495870f

# Helper scripts from gists: cloned into ~/bin/<id> and symlinked into ~/bin. Deliberately NOT pinned
# (exception to the pinning rule): they track master and are refreshed by hand with `git pull`.
gists_update: false
bin_gists:
  - {id: a378af54e493b337cb0219bc06d4aedb, script: fix_permissions.sh, link: fix_permissions.sh}
  - {id: 6648189742935af244f032240b93050c, script: squeue_galileo.sh, link: squeue.sh}
  - {id: d4d7c3c599675765c1ca74adf266c5fa, script: sacct_galileo.sh, link: sacct.sh}
  - {id: 625bec709906c6c2f9815fc10be99c52, script: rotate_stuff.sh, link: rotate_stuff.sh}

...
