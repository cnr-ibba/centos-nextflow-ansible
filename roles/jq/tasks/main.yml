---
# jq is needed by squeue.sh / sacct.sh (gists role). Static binary, same pattern as the nextflow role.
- name: Install jq {{ jq_version }}
  ansible.builtin.get_url:
    url: "{{ jq_url }}"
    checksum: "sha256:{{ jq_sha256 }}"
    dest: "{{ ansible_env.HOME }}/bin/jq"
    mode: "0755"
  # --check on a fresh host: ~/bin does not exist yet, get_url would fail
  when: not (common_bin is changed and ansible_check_mode)

...
