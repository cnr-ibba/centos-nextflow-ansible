---
# Plain static binary from the release assets: the .tar.bz2 used by galaxyproject.miniconda
# is a conda package and would scatter its info/ files in ~/bin
- name: Create ~/bin
  ansible.builtin.file:
    path: "{{ ansible_env.HOME }}/bin"
    state: directory
    mode: "0755"

- name: Install micromamba {{ micromamba_version }}
  ansible.builtin.get_url:
    url: "{{ micromamba_url }}"
    checksum: "sha256:{{ micromamba_url }}.sha256"
    dest: "{{ ansible_env.HOME }}/bin/micromamba"
    mode: "0755"

...
