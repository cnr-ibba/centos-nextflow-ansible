---
# Plain static binary from the release assets: the .tar.bz2 is a conda package
# and would scatter its info/ files in ~/bin
- name: Install micromamba {{ micromamba_version }}
  ansible.builtin.get_url:
    url: "{{ micromamba_url }}"
    checksum: "sha256:{{ micromamba_url }}.sha256"
    dest: "{{ ansible_env.HOME }}/bin/micromamba"
    mode: "0755"
  # --check on a fresh host: ~/bin does not exist yet, get_url would fail
  when: not (common_bin is changed and ansible_check_mode)

...
