---
# Each gist is cloned once (update: false) into ~/bin/<gist id> and the script is symlinked
# (relative link) into ~/bin; refresh by hand with `git pull` in the clone.
- name: Clone the gists
  ansible.builtin.git:
    repo: "https://gist.github.com/{{ item.id }}.git"
    dest: "{{ ansible_env.HOME }}/bin/{{ item.id }}"
    version: master
    update: "{{ gists_update }}"
  loop: "{{ bin_gists }}"
  loop_control:
    label: "{{ item.id }}"
  # --check on a fresh host: ~/bin does not exist yet
  when: not (common_bin is changed and ansible_check_mode)

- name: Link the gist scripts into ~/bin
  ansible.builtin.file:
    src: "{{ item.id }}/{{ item.script }}"
    dest: "{{ ansible_env.HOME }}/bin/{{ item.link }}"
    state: link
  loop: "{{ bin_gists }}"
  loop_control:
    label: "{{ item.link }}"
  when: not (common_bin is changed and ansible_check_mode)

...
