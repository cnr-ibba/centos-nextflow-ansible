---
# glow ships as a tar.gz: download (sha256-checked), extract only the binary into ~/bin, drop the tarball.
# The installed version is read first (read-only), so a pinned version bump reinstalls and reruns are changed=0.
- name: Detect installed glow
  ansible.builtin.command: "{{ ansible_env.HOME }}/bin/glow --version"
  register: glow_installed
  changed_when: false
  failed_when: false
  check_mode: false

- name: Install glow {{ glow_version }}
  when:
    - glow_version not in (glow_installed.stdout | default(''))
    # --check on a fresh host: ~/bin does not exist yet
    - not (common_bin is changed and ansible_check_mode)
  block:
    - name: Ensure ~/.cache exists
      ansible.builtin.file:
        path: "{{ ansible_env.HOME }}/.cache"
        state: directory

    - name: Download glow {{ glow_version }}
      ansible.builtin.get_url:
        url: "{{ glow_url }}"
        checksum: "sha256:{{ glow_sha256 }}"
        dest: "{{ ansible_env.HOME }}/.cache/glow.tar.gz"
        mode: "0644"

    - name: Extract the glow binary into ~/bin
      ansible.builtin.unarchive:
        src: "{{ ansible_env.HOME }}/.cache/glow.tar.gz"
        dest: "{{ ansible_env.HOME }}/bin"
        remote_src: true
        extra_opts: ["--strip-components=1", "--wildcards", "*/glow"]
        mode: "0755"
      # --check: the tarball was not downloaded
      when: not ansible_check_mode

    - name: Remove the glow tarball
      ansible.builtin.file:
        path: "{{ ansible_env.HOME }}/.cache/glow.tar.gz"
        state: absent
      when: not ansible_check_mode

...
