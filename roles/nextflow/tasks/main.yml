---
# NXF_* variables come from the dotfiles; Java comes from the sdkman role.
- name: Create ~/.nextflow
  ansible.builtin.file:
    path: "{{ ansible_env.HOME }}/.nextflow"
    state: directory
    mode: "0755"

- name: Install Nextflow {{ nextflow_version }}
  ansible.builtin.get_url:
    url: "{{ nextflow_url }}"
    checksum: "sha256:{{ nextflow_sha256 }}"
    dest: "{{ ansible_env.HOME }}/bin/nextflow"
    mode: "0755"
  # --check on a fresh host: ~/bin does not exist yet, get_url would fail
  when: not (common_bin is changed and ansible_check_mode)

- name: Configure the Nextflow executor
  ansible.builtin.copy:
    dest: "{{ ansible_env.HOME }}/.nextflow/config"
    backup: true
    mode: "0644"
    content: |
      executor {
          queueSize = 50
          submitRateLimit = '50/2min'
      }

...
